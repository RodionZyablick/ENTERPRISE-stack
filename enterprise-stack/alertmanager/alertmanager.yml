global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'instance', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'telegram-notifications'
  routes:
    - match:
        severity: critical
      receiver: 'telegram-notifications'
      group_wait: 10s
      repeat_interval: 1h
    - match:
        severity: warning
      receiver: 'telegram-notifications'
      repeat_interval: 4h

receivers:
  - name: 'telegram-notifications'
    telegram_configs:
      - bot_token: '1234567890:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA'
        chat_id: -1001234567890
        api_url: 'https://api.telegram.org'
        send_resolved: true
        parse_mode: 'HTML'
        message: |
          <b>{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}</b>
          {{ range .Alerts }}
          <b>Alert:</b> {{ .Labels.alertname }}
          <b>Severity:</b> {{ .Labels.severity }}
          <b>Instance:</b> {{ .Labels.instance }}
          <b>Summary:</b> {{ .Annotations.summary }}
          <b>Description:</b> {{ .Annotations.description }}
          {{ end }}

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']